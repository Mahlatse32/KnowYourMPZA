services:
  backend:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://knowyourmpza:knowyourmpza@db:5432/knowyourmpza
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: knowyourmpza
      POSTGRES_PASSWORD: knowyourmpza
      POSTGRES_DB: knowyourmpza
    volumes:
      - knowyourmpza_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowyourmpza -d knowyourmpza"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  knowyourmpza_postgres_data:
