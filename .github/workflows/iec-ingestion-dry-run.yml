name: IEC ingestion dry run

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Safety confirmation; this workflow never writes IEC result rows"
        required: true
        default: "true"
        type: choice
        options: ["true"]
      limit:
        description: "Maximum offline manifest fixture sources"
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: knowyourmpza
          POSTGRES_PASSWORD: knowyourmpza
          POSTGRES_DB: knowyourmpza
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knowyourmpza -d knowyourmpza"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://knowyourmpza:knowyourmpza@localhost:5432/knowyourmpza

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare reports directory
        run: mkdir -p reports

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Apply schema to ephemeral validation database
        run: alembic upgrade head

      - name: Dry-run IEC metadata manifest ingestion
        run: >-
          python scripts/ingest_iec_metadata_manifest.py
          --dry-run
          --offline-fixture tests/fixtures/iec/metadata_manifest_dry_run.json
          --limit "${{ github.event.inputs.limit || '1' }}"
          --reports-dir reports
          --json-only

      - name: Generate IEC coverage report
        run: python scripts/report_iec_coverage.py

      - name: Upload IEC dry-run reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iec-ingestion-dry-run-reports
          path: backend/reports/
          if-no-files-found: warn
          retention-days: 14
