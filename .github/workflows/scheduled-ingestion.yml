name: Scheduled ingestion

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"
    - cron: "45 4 * * 0"

jobs:
  daily:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '15 3 * * *'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      INGESTION_ENABLED: ${{ secrets.INGESTION_ENABLED }}
      SOURCE_RATE_LIMIT_SLEEP: ${{ vars.SOURCE_RATE_LIMIT_SLEEP || '0.5' }}
      MAX_DAILY_INGESTION_URLS: ${{ vars.MAX_DAILY_INGESTION_URLS || '50' }}
    steps:
      - name: Validate scheduled ingestion configuration
        run: |
          case "${INGESTION_ENABLED,,}" in
            1|true|yes) ;;
            *)
              echo "::error::Scheduled ingestion is disabled. Set the repository Actions secret INGESTION_ENABLED to true."
              exit 1
              ;;
          esac
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::The repository Actions secret DATABASE_URL is not configured."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: python scripts/run_daily_ingestion.py
      - name: Data coverage dashboard
        if: always()
        run: python scripts/report_data_coverage_dashboard.py || true

  weekly:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '45 4 * * 0'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      INGESTION_ENABLED: ${{ secrets.INGESTION_ENABLED }}
      SOURCE_RATE_LIMIT_SLEEP: ${{ vars.SOURCE_RATE_LIMIT_SLEEP || '0.5' }}
      MAX_WEEKLY_INGESTION_URLS: ${{ vars.MAX_WEEKLY_INGESTION_URLS || '100' }}
    steps:
      - name: Validate scheduled ingestion configuration
        run: |
          case "${INGESTION_ENABLED,,}" in
            1|true|yes) ;;
            *)
              echo "::error::Scheduled ingestion is disabled. Set the repository Actions secret INGESTION_ENABLED to true."
              exit 1
              ;;
          esac
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::The repository Actions secret DATABASE_URL is not configured."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: python scripts/run_weekly_ingestion.py
      - name: Data coverage dashboard
        if: always()
        run: python scripts/report_data_coverage_dashboard.py || true
