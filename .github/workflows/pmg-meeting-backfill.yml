name: PMG meeting backfill

# V1 coverage recovery for the pmg_committee_meetings stream (issue #59).
# The daily accountability sweep advances every stream by only a few pages
# per day, which cannot close a ~695-page source within the launch window.
# This workflow sweeps ONLY the committee meetings stream on a frequent
# schedule, reusing the same durable cursor, guards, and reports as the
# daily sweep. It shares the daily sweep's concurrency group, so the two
# can never overlap and the cursor stays safe.
#
# When meeting coverage reaches the V1 target (>= 80% of the PMG source
# denominator), disable the cron block below — the daily accountability
# sweep then keeps the stream fresh via its wrap-to-page-0 refresh passes.

on:
  workflow_dispatch:
    inputs:
      pages_per_run:
        description: "Bounded page window for the meetings stream (safety cap 10)"
        required: false
        default: "10"
      dry_run:
        description: "Validation mode: no writes, no sweep advancement"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  schedule:
    # Every 2 hours, offset from the daily accountability sweep (02:30) and
    # scheduled ingestion (03:15). Delete or comment this block to disable.
    - cron: "50 */2 * * *"

permissions:
  contents: read
  actions: read

# Shared with accountability-sweep.yml: a backfill run must never overlap
# the daily sweep (or another backfill run) — overlapping runs would race
# on the same sweep cursor rows.
concurrency:
  group: accountability-sweep
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    services:
      # Ephemeral fallback database. Used ONLY for validation/dry-run mode —
      # run_scheduled_sweep.py refuses real sweeps against it because sweep
      # state would not persist between runs.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: knowyourmpza
          POSTGRES_PASSWORD: knowyourmpza
          POSTGRES_DB: knowyourmpza
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knowyourmpza -d knowyourmpza"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ENVIRONMENT: development
      PAGES_PER_RUN: ${{ github.event.inputs.pages_per_run || '10' }}
      INPUT_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      # Never echo DATABASE_URL — it may contain credentials.
      PERSISTENT_DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare reports directory
        run: mkdir -p reports

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Select database mode
        id: mode
        run: |
          if [ -n "$PERSISTENT_DATABASE_URL" ]; then
            echo "Persistent DATABASE_URL secret is configured — real backfill mode available."
            echo "DATABASE_URL=$PERSISTENT_DATABASE_URL" >> "$GITHUB_ENV"
            echo "SWEEP_DB_PERSISTENT=true" >> "$GITHUB_ENV"
            echo "dry_run=$INPUT_DRY_RUN" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No DATABASE_URL secret configured — falling back to ephemeral Postgres in VALIDATION (dry-run) mode. Sweep state will NOT persist. Add the DATABASE_URL secret to enable real backfill runs."
            echo "DATABASE_URL=postgresql+psycopg://knowyourmpza:knowyourmpza@localhost:5432/knowyourmpza" >> "$GITHUB_ENV"
            echo "SWEEP_DB_PERSISTENT=false" >> "$GITHUB_ENV"
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run migrations
        run: alembic upgrade head

      - name: Preflight persistent DB readiness
        # Real mode only: refuse to ingest against a database that is not
        # ready. Validation (dry-run) mode skips this — its ephemeral DB is
        # intentionally throwaway.
        if: env.SWEEP_DB_PERSISTENT == 'true'
        run: |
          python scripts/check_persistent_db_ready.py --check-sweep --json-output --write-report
          echo "Persistent DB readiness: OK"

      - name: Run committee meetings backfill sweep
        run: |
          DRY_FLAG=""
          if [ "${{ steps.mode.outputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          python scripts/run_scheduled_sweep.py \
            --pages-per-run "$PAGES_PER_RUN" \
            --sleep 0.5 \
            --streams pmg_committee_meetings \
            $DRY_FLAG

      - name: Inspect database and sweep state
        if: always()
        run: python scripts/inspect_db.py --samples 3 --show-sweep-state --json-output > reports/inspect_db.json || true

      - name: Data coverage dashboard
        if: always()
        run: python scripts/report_data_coverage_dashboard.py || true

      - name: Generate V1 readiness report
        # Consolidated launch-readiness artifact (PR #62): rebuilds
        # v1_readiness_report.json/.md from this run's inspect_db and
        # dashboard outputs so every backfill run shows PMG meeting
        # coverage progress against the launch threshold.
        if: always()
        run: python scripts/report_v1_readiness.py --reports-dir reports || true

      - name: Publish step summary
        if: always()
        run: |
          if [ -f reports/accountability_sweep_report.md ]; then
            cat reports/accountability_sweep_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No backfill sweep report was generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload run reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmg-meeting-backfill-reports-${{ github.run_number }}
          path: backend/reports/
          if-no-files-found: warn
          retention-days: 30
